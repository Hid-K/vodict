name: Release builds

# Сборка дистрибутивов и прикрепление к релизу.
#
# Два способа запуска:
# 1) Публикация релиза на GitHub (релиз с тегом, например v0.1.0) —
#    соберёт Vodict-windows-<тег>.zip и Vodict-setup-<тег>.exe и
#    автоматически прикрепит их к релизу.
# 2) Вручную (workflow_dispatch): билд уйдёт в артефакты; если заполнить
#    «tag» — файлы прикрепятся к указанному существующему релизу.
#
# TODO: сборка macOS (.app -> .dmg) — отложена, займёмся отдельно.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза для прикрепления файлов (пусто = не прикреплять)"
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller

      - name: Сборка (PyInstaller)
        run: pyinstaller --noconfirm packaging/vodict.spec

      - name: Архив (Windows, portable)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Vodict/* `
            -DestinationPath "Vodict-windows-$env:VERSION.zip"
          Get-Item "Vodict-windows-$env:VERSION.zip" |
            Select-Object Name, Length

      - name: Инсталлятор (Inno Setup, обновление поверх старой версии)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC не найден: $iscc" }
          & $iscc /DMyAppVersion=$env:VERSION packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Сборка инсталлятора (ISCC) завершилась с ошибкой" }
          Get-Item "dist/installer/Vodict-setup-*.exe"

      - name: Контрольные суммы (SHA256)
        shell: pwsh
        run: |
          $files = Get-ChildItem "Vodict-windows-*.zip", "dist/installer/Vodict-setup-*.exe"
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # TODO: сборка macOS (.app -> .dmg) — отложено

      - name: Прикрепить к релизу
        # shell: bash обязателен: pwsh не раскрывает wildcard'ы для нативных
        # команд и не роняет шаг при ошибке середины скрипта
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -x
          echo "VERSION=$VERSION"
          echo "GH_REPO=$GH_REPO"
          ls -la Vodict-windows-*.zip dist/installer/Vodict-setup-*.exe || true
          gh --version
          gh auth status
          if ! gh release upload "$VERSION" --clobber Vodict-windows-*.zip dist/installer/Vodict-setup-*.exe SHA256SUMS.txt; then
            echo "::error::gh release upload завершился с ошибкой — см. вывод выше"
            exit 1
          fi
          count=$(gh release view "$VERSION" --json assets --jq '.assets | length')
          echo "файлов на релизе: $count"
          if [ "$count" -lt 2 ]; then
            echo "::error::Не все файлы прикрепились к релизу ($count < 2)"
            exit 1
          fi
          echo "✓ Файлы прикреплены к релизу $VERSION"

      - name: Артефакт (всегда, для тестов)
        uses: actions/upload-artifact@v4
        with:
          name: Vodict-build-${{ env.VERSION }}
          path: |
            Vodict-windows-*.zip
            dist/installer/Vodict-setup-*.exe
            SHA256SUMS.txt
