name: Release builds

# Сборка дистрибутивов и прикрепление к релизу.
#
# Два способа запуска:
# 1) Публикация релиза на GitHub (релиз с тегом, например v0.2.0) —
#    соберёт Vodict-windows-<тег>.zip, Vodict-setup-<тег>.exe и
#    Vodict-macos-<тег>.dmg и автоматически прикрепит их к релизу.
# 2) Вручную (workflow_dispatch): билд уйдёт в артефакты; если заполнить
#    «tag» — файлы прикрепятся к указанному существующему релизу.
#
# TODO: сборка macOS (.app -> .dmg) — отложена, займёмся отдельно.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза для прикрепления файлов (пусто = не прикреплять)"
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller

      - name: Сборка (build_app.py: exe + portable + установщик + selftest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          python scripts/build_app.py --zip --installer --selftest --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "build_app.py завершился с ошибкой" }
          Get-Item "Vodict-windows-$env:VERSION.zip", "dist/installer/Vodict-setup-*.exe"

      - name: Контрольные суммы (SHA256)
        shell: pwsh
        run: |
          $files = Get-ChildItem "Vodict-windows-*.zip", "dist/installer/Vodict-setup-*.exe"
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # TODO: сборка macOS (.app -> .dmg) — отложено

      - name: Прикрепить к релизу
        # shell: bash обязателен: pwsh не раскрывает wildcard'ы для нативных
        # команд и не роняет шаг при ошибке середины скрипта
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -x
          echo "VERSION=$VERSION"
          echo "GH_REPO=$GH_REPO"
          ls -la Vodict-windows-*.zip dist/installer/Vodict-setup-*.exe || true
          gh --version
          gh auth status
          if ! gh release upload "$VERSION" --clobber Vodict-windows-*.zip dist/installer/Vodict-setup-*.exe SHA256SUMS.txt; then
            echo "::error::gh release upload завершился с ошибкой — см. вывод выше"
            exit 1
          fi
          # Валидация: если VERSION не резолвится в тег релиза (ручной запуск
          # с пустым полем tag) — не роняем шаг, файлы уже загружены.
          count=$(gh release view "$VERSION" --json assets --jq '.assets | length' 2>/dev/null || echo "?")
          echo "файлов на релизе: $count"
          if [ "$count" != "?" ] && [ "$count" -lt 2 ]; then
            echo "::error::Не все файлы прикрепились к релизу ($count < 2)"
            exit 1
          fi
          echo "✓ Файлы прикреплены к релизу $VERSION"

      - name: Артефакт (всегда, для тестов)
        uses: actions/upload-artifact@v4
        with:
          name: Vodict-build-${{ env.VERSION }}
          path: |
            Vodict-windows-*.zip
            dist/installer/Vodict-setup-*.exe
            SHA256SUMS.txt

  # Сборка под Apple Silicon (M1/M2). Приложение без подписи: на машине
  # друга после распаковки снять карантин — xattr -cr /Applications/Vodict.app
  # (подробности в README, раздел про macOS).
  build-macos:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PortAudio (для sounddevice)
        run: brew install portaudio

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller

      - name: Санити-проверка импортов
        run: python -c "import sounddevice, faster_whisper, ctranslate2, av; print('imports ok')"

      - name: Сборка (PyInstaller -> Vodict.app)
        run: pyinstaller --noconfirm packaging/vodict.spec

      - name: Проверка наличия .app
        run: |
          test -d "dist/Vodict.app"
          ls -la dist/

      - name: Проверка UI-стека (--selftest)
        run: dist/Vodict.app/Contents/MacOS/Vodict --selftest

      - name: Упаковка (.dmg)
        run: |
          cd dist
          hdiutil create -volname Vodict -srcfolder "$(pwd)/Vodict.app" \
            -ov -format UDZO "Vodict-macos-${VERSION}.dmg"
          ls -la Vodict-macos-*.dmg

      - name: Прикрепить к релизу (macOS)
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -x
          ls -la dist/Vodict-macos-*.dmg
          gh release upload "$VERSION" --clobber dist/Vodict-macos-*.dmg
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Артефакт (вне релиза)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Vodict-macos
          path: dist/Vodict-macos-*.dmg
